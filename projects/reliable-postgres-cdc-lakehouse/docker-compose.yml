services:
  postgres:
    image: postgres:17
    container_name: portfolio-postgres
    
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEBEZIUM_USER_PASSWORD: ${DEBEZIUM_USER_PASSWORD}
    
    ports:
      - "15432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgresql/init:/docker-entrypoint-initdb.d
      - ./postgresql/schema:/opt/postgresql/schema
      - ./postgresql/seed:/opt/postgresql/seed

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    
    command:
      - postgres
      - -c
      - wal_level=logical
  
  kafka:
    image: apache/kafka:4.3.1
    container_name: portfolio-kafka
    environment:
      KAFKA_NODE_ID: 1 #producao seriam mais nós e com responsabilidades desacopladas.
      KAFKA_PROCESS_ROLES: broker,controller #em produção cada nó teria o seu papel.
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}

      KAFKA_LISTENERS: 'INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:9092,EXTERNAL://localhost:29092'

      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT' #producao seria diferente, protocolos mais apropriados
      
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093' #<node.id>@<host>:<porta-do-controller>

      KAFKA_LOG_DIRS: '/var/lib/kafka/data'

      #como o cluster é single-node, precisamos ajustar a replicação padrão.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    ports:
      - "29092:29092" #HOST:CONTAINER

    volumes:
      - kafka-data:/var/lib/kafka/data #persistencia de dados (topicos, mensagens, partições e offsets)

  connect:
    image: quay.io/debezium/connect:3.5.2.Final  # imagem do Kafka Connect já com os plugins Debezium
    container_name: portfolio-connect            # nome do container Kafka Connect

    environment:
      BOOTSTRAP_SERVERS: kafka:9092              # endereço interno do broker Kafka dentro da rede Docker
      GROUP_ID: portfolio-connect-cluster        # identifica o cluster lógico de workers Kafka Connect

      CONFIG_STORAGE_TOPIC: connect-configs      # topic interno que armazena as configurações dos connectors
      OFFSET_STORAGE_TOPIC: connect-offsets      # topic interno que armazena o progresso/checkpoints dos connectors
      STATUS_STORAGE_TOPIC: connect-status       # topic interno que armazena status de connectors e tasks

      CONFIG_STORAGE_REPLICATION_FACTOR: 1       # réplicas do topic connect-configs default = 3
      OFFSET_STORAGE_REPLICATION_FACTOR: 1       # réplicas do topic connect-offsets default = 3
      STATUS_STORAGE_REPLICATION_FACTOR: 1       # réplicas do topic connect-status default = 3

      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter      # converte a key das mensagens Kafka Connect para JSON
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter    # converte o value/evento para JSON
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"                           # evita incluir schema Kafka Connect junto da key
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"                         # deixa o payload JSON mais simples para nosso laboratório

      DEBEZIUM_USER: "${DEBEZIUM_USER}"                               # usuário PostgreSQL utilizado pelo connector
      DEBEZIUM_USER_PASSWORD: ${DEBEZIUM_USER_PASSWORD}               # disponibiliza a senha do usuário Debezium dentro do container Kafka Connect

      CONNECT_CONFIG_PROVIDERS: env                      # registra um ConfigProvider com o alias "env"
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider  # faz o alias "env" ler valores das variáveis de ambiente do container

    ports:
    - "8083:8083"  # expõe a API REST do Kafka Connect para o Windows

    depends_on:
    - kafka  # garante que o container Kafka seja iniciado antes do Kafka Connect

  minio:
    image: minio/minio:latest  # imagem oficial do servidor MinIO
    container_name: portfolio-minio

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "9000:9000"  # API S3 usada por Spark/Iceberg
      - "9001:9001"  # console web administrativo

    volumes:
      - minio-data:/data

    command: server /data --console-address ":9001"  # inicia o servidor usando /data e expõe o console na porta 9001

  minio-init:
    image: minio/mc:latest  # cliente CLI do MinIO usado para inicialização
    container_name: portfolio-minio-init

    depends_on:
      - minio

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    entrypoint: >
      /bin/sh -c "
        until /usr/bin/mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
          sleep 2;
        done;
        /usr/bin/mc mb --ignore-existing local/lakehouse;
        /usr/bin/mc mb --ignore-existing local/spark-checkpoints;
        exit 0;
      "
      
  spark-orders:
    image: portfolio-spark:4.1.3
    container_name: portfolio-spark-orders

    environment:
      KAFKA_TOPIC: cdc_debezium.public.orders
      RAW_PATH: s3a://lakehouse/raw/orders
      CHECKPOINT_PATH: s3a://spark-checkpoints/raw-orders
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    volumes:
      - ./spark/historical:/opt/spark/work-dir:ro

    command:
      - /opt/spark/bin/spark-submit
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.3,org.apache.hadoop:hadoop-aws:3.4.2
      - /opt/spark/work-dir/historical_ingestion.py

    depends_on:
      - kafka
      - minio

  spark-payments:
    image: portfolio-spark:4.1.3
    container_name: portfolio-spark-payments

    environment:
      KAFKA_TOPIC: cdc_debezium.public.payments
      RAW_PATH: s3a://lakehouse/raw/payments
      CHECKPOINT_PATH: s3a://spark-checkpoints/raw-payments
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    volumes:
      - ./spark/historical:/opt/spark/work-dir:ro

    command:
      - /opt/spark/bin/spark-submit
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.3,org.apache.hadoop:hadoop-aws:3.4.2
      - /opt/spark/work-dir/historical_ingestion.py

    depends_on:
      - kafka
      - minio

  spark-refunds:
    image: portfolio-spark:4.1.3
    container_name: portfolio-spark-refunds

    environment:
      KAFKA_TOPIC: cdc_debezium.public.refunds
      RAW_PATH: s3a://lakehouse/raw/refunds
      CHECKPOINT_PATH: s3a://spark-checkpoints/raw-refunds
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    volumes:
      - ./spark/historical:/opt/spark/work-dir:ro

    command:
      - /opt/spark/bin/spark-submit
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.3,org.apache.hadoop:hadoop-aws:3.4.2
      - /opt/spark/work-dir/historical_ingestion.py

    depends_on:
      - kafka
      - minio

volumes:
  postgres-data:
  kafka-data:
  minio-data:
