services:
  postgres:
    image: postgres:17
    container_name: portfolio-postgres
    
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEBEZIUM_USER_PASSWORD: ${DEBEZIUM_USER_PASSWORD}
    
    ports:
      - "15432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgresql/init:/docker-entrypoint-initdb.d
      - ./postgresql/schema:/opt/postgresql/schema
      - ./postgresql/seed:/opt/postgresql/seed

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    
    command:
      - postgres
      - -c
      - wal_level=logical
  
  kafka:
    image: apache/kafka:4.3.1
    container_name: portfolio-kafka
    environment:
      KAFKA_NODE_ID: 1 #producao seriam mais nós e com responsabilidades desacopladas.
      KAFKA_PROCESS_ROLES: broker,controller #em produção cada nó teria o seu papel.
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}

      KAFKA_LISTENERS: 'INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:9092,EXTERNAL://localhost:29092'

      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT' #producao seria diferente, protocolos mais apropriados
      
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093' #<node.id>@<host>:<porta-do-controller>

      KAFKA_LOG_DIRS: '/var/lib/kafka/data'

      #como o cluster é single-node, precisamos ajustar a replicação padrão.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    ports:
      - "29092:29092" #HOST:CONTAINER

    volumes:
      - kafka-data:/var/lib/kafka/data #persistencia de dados (topicos, mensagens, partições e offsets)

  connect:
    image: quay.io/debezium/connect:3.5.2.Final  # imagem do Kafka Connect já com os plugins Debezium
    container_name: portfolio-connect            # nome do container Kafka Connect

    environment:
      BOOTSTRAP_SERVERS: kafka:9092              # endereço interno do broker Kafka dentro da rede Docker
      GROUP_ID: portfolio-connect-cluster        # identifica o cluster lógico de workers Kafka Connect

      CONFIG_STORAGE_TOPIC: connect-configs      # topic interno que armazena as configurações dos connectors
      OFFSET_STORAGE_TOPIC: connect-offsets      # topic interno que armazena o progresso/checkpoints dos connectors
      STATUS_STORAGE_TOPIC: connect-status       # topic interno que armazena status de connectors e tasks

      CONFIG_STORAGE_REPLICATION_FACTOR: 1       # réplicas do topic connect-configs default = 3
      OFFSET_STORAGE_REPLICATION_FACTOR: 1       # réplicas do topic connect-offsets default = 3
      STATUS_STORAGE_REPLICATION_FACTOR: 1       # réplicas do topic connect-status default = 3

      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter      # converte a key das mensagens Kafka Connect para JSON
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter    # converte o value/evento para JSON
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"                           # evita incluir schema Kafka Connect junto da key
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"                         # deixa o payload JSON mais simples para nosso laboratório

      DEBEZIUM_USER: "${DEBEZIUM_USER}"                               # usuário PostgreSQL utilizado pelo connector
      DEBEZIUM_USER_PASSWORD: ${DEBEZIUM_USER_PASSWORD}               # disponibiliza a senha do usuário Debezium dentro do container Kafka Connect

      CONNECT_CONFIG_PROVIDERS: env                      # registra um ConfigProvider com o alias "env"
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider  # faz o alias "env" ler valores das variáveis de ambiente do container

    ports:
    - "8083:8083"  # expõe a API REST do Kafka Connect para o Windows

    depends_on:
    - kafka  # garante que o container Kafka seja iniciado antes do Kafka Connect

  minio:
    image: minio/minio:latest  # imagem oficial do servidor MinIO
    container_name: portfolio-minio

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION: sa-east-1

    ports:
      - "9000:9000"  # API S3 usada por outros serviços (spark, iceberg, polaris, etc)
      - "9001:9001"  # console web administrativo

    volumes:
      - minio-data:/data

    command: server /data --console-address ":9001"  # inicia o servidor usando /data e expõe o console na porta 9001

  minio-init:
    image: minio/mc:latest  # cliente CLI do MinIO usado para inicialização
    container_name: portfolio-minio-init

    depends_on:
      - minio

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    entrypoint: >
      /bin/sh -c "
        until /usr/bin/mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
          sleep 2;
        done;
        /usr/bin/mc mb --ignore-existing local/lakehouse;
        /usr/bin/mc mb --ignore-existing local/spark-checkpoints;
        exit 0;
      "
      
  spark-orders:
    image: portfolio-spark:4.1.3
    container_name: portfolio-spark-orders

    environment:
      KAFKA_TOPIC: cdc_debezium.public.orders
      RAW_PATH: s3a://lakehouse/raw/landing/orders
      CHECKPOINT_PATH: s3a://spark-checkpoints/raw-landing-orders
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    volumes:
      - ./spark/historical/historical_ingestion.py:/opt/spark/work-dir/historical_ingestion.py
      - ./spark/historical/compaction_job.py:/opt/spark/work-dir/compaction_job.py
      - ./spark/consolidation/orders_cdc_parser.py:/opt/spark/work-dir/orders_cdc_parser.py

    command:
      - /opt/spark/bin/spark-submit
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.3,org.apache.hadoop:hadoop-aws:3.4.2
      - /opt/spark/work-dir/historical_ingestion.py

    depends_on:
      - kafka
      - minio

  spark-payments:
    image: portfolio-spark:4.1.3
    container_name: portfolio-spark-payments

    environment:
      KAFKA_TOPIC: cdc_debezium.public.payments
      RAW_PATH: s3a://lakehouse/raw/landing/payments
      CHECKPOINT_PATH: s3a://spark-checkpoints/raw-landing-payments
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    volumes:
      - ./spark/historical:/opt/spark/work-dir:ro

    command:
      - /opt/spark/bin/spark-submit
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.3,org.apache.hadoop:hadoop-aws:3.4.2
      - /opt/spark/work-dir/historical_ingestion.py

    depends_on:
      - kafka
      - minio

  spark-refunds:
    image: portfolio-spark:4.1.3
    container_name: portfolio-spark-refunds

    environment:
      KAFKA_TOPIC: cdc_debezium.public.refunds
      RAW_PATH: s3a://lakehouse/raw/landing/refunds
      CHECKPOINT_PATH: s3a://spark-checkpoints/raw-landing-refunds
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    volumes:
      - ./spark/historical:/opt/spark/work-dir:ro

    command:
      - /opt/spark/bin/spark-submit
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.3,org.apache.hadoop:hadoop-aws:3.4.2
      - /opt/spark/work-dir/historical_ingestion.py

    depends_on:
      - kafka
      - minio

  postgres-polaris:
    image: postgres:17
    container_name: postgres-polaris
    
    environment:
      POSTGRES_DB: polaris
      POSTGRES_USER: polaris
      POSTGRES_PASSWORD: ${POLARIS_DB_PASSWORD}

    volumes:
      #Persistencia do estado do catálogo entre reinicializações
      - polaris-postgres-data:/var/lib/postgresql/data
      - ./polaris/postgres-init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      #Healthy = aceita conexões
      test: ["CMD-SHELL", "pg_isready -U polaris -d polaris"]
      interval: 5s
      timeout: 5s
      retries: 10
      
    restart: unless-stopped

  polaris:
    image: apache/polaris:1.8.0
    container_name: portfolio-polaris

    depends_on:
      postgres-polaris:
        condition: service_healthy

      polaris-bootstrap:
        condition: service_completed_successfully

    environment:
      #persistencia jdbc
      POLARIS_PERSISTENCE_TYPE: relational-jdbc

      #conexão com o postgres dedicado ao polaris
      QUARKUS.DATASOURCE.USERNAME: polaris
      QUARKUS.DATASOURCE.PASSWORD: ${POLARIS_DB_PASSWORD}
      QUARKUS.DATASOURCE.JDBC.URL: "jdbc:postgresql://postgres-polaris:5432/polaris?currentSchema=polaris_schema"

      #Realm criado anteriormente pelo polaris-bootstrap
      POLARIS_REALM_CONTEXT_REALMS: POLARIS

    ports:
      #REST APIs: Iceberg  Management API
      - "8181:8181"

      #Health check a metricas
      - "8182:8182"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8182/q/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    restart: unless-stopped

  polaris-bootstrap:
    image: apache/polaris-admin-tool:1.8.0

    depends_on:
      postgres-polaris:
        condition: service_healthy

    environment:
      #persistencia jdbc
      polaris_persistence_type: relational-jdbc

      #conexão com o postgres dedicado ao polaris
      quarkus.datasource.username: polaris
      quarkus.datasource.password: ${POLARIS_DB_PASSWORD}
      quarkus.datasource.jdbc.url: "jdbc:postgresql://postgres-polaris:5432/polaris?currentSchema=polaris_schema"

    command:
      - bootstrap
      - -r
      - POLARIS
      - -c
      - POLARIS,root,${POLARIS_ROOT_CLIENT_SECRET}

    restart: no

  polaris-init:
    image: python:3.12-slim

    depends_on:
      polaris:
        condition: service_healthy

    environment:
      POLARIS_API_URL: http://polaris:8181
      POLARIS_REALM: POLARIS
      POLARIS_USER: root
      POLARIS_ROOT_CLIENT_SECRET: ${POLARIS_ROOT_CLIENT_SECRET}
      POLARIS_CATALOG: lakehouse
      POLARIS_NAMESPACE: analytics

    volumes:
      - ./infra/polaris/init/init_polaris.py:/opt/polaris/work-dir/init_polaris.py:ro

    command: ["python", "/opt/polaris/work-dir/init_polaris.py"]

    restart: "no"
  

volumes:
  postgres-data:
  kafka-data:
  minio-data:
  polaris-postgres-data:
